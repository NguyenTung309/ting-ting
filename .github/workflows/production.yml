name: Production CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_production_deploy:
        description: Deploy the candidate to production after CI and image publishing pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify application and container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tinhtinhtingting:ci-${{ github.sha }}

  publish:
    name: Publish immutable image
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/wuwuyn/tinhtinhtingting:${{ github.sha }}

  deploy:
    name: Deploy production
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.approve_production_deploy) ||
      vars.PRODUCTION_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: tinhtinhtingting-production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure pinned SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Authenticate server to GHCR and deploy
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -eu
          ssh_args="-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          printf '%s' "$GHCR_READ_TOKEN" | ssh $ssh_args "$DEPLOY_USER@$DEPLOY_HOST" 'sudo /usr/local/sbin/ttt-ghcr-login'
          ssh $ssh_args "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/ttt-deploy '$IMAGE_SHA'"
